<!DOCTYPE html>
<html lang="en">

</head>
<body>

    <!-- bagian welcome -->
     <div id="welcome" class="slmtDatang">
        <div class="welcome-content">
            <h2>Welcome </h2>
            <p>Tolong input nama kamu</p>
            <input type="text" id="inputNama" placeholder="Nama Kamu">
            <button id="tombolOk">Enter</button>
        </div>
     </div>
    
    <!--bagian navigasi-->
    <nav class="navigasi">
        <div class="logo">FrogDev</div>
        <ul class="bagian-nav">
            <li><a href="index.html">Home</a></li>
            <li><a href="profile.html">Our Profile</a></li>
            <li><a href="#pesan">Message Us</a></li>
        </ul>
    </nav>

    <!-- bagian home-->
     <section id="home" class="rumah">
        <h1 id="sayHai">Hi, Guest</h1>
        <p>Welcome to my website</p>
     </section>

    <!--bagian profile-->
    <section class="kdk">
        <h2>Our Headquarter</h2>
        <div class="kdk-container">
            <div class="kdk-item">
                <div class="bulet"></div>
                <p>Sungai</p>
            </div>
            <div class="kdk-item">
                <div class="bulet"></div>
                <p>Rawa-rawa</p>
            </div>
            <div class="kdk-item">
                <div class="bulet"></div>
                <p>Sawah</p>
            </div>
        </div>
    </section>

    <!--bagian untuk memasukan pesan-->
    <section id="pesan" class="pesan-sec">
    <h2>Message Us</h2>

    <form id="formPesan">
        <input type="text" id="nama" placeholder="Nama kamu">
        <input type="date" id="ultah">

        <div class="gender">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>

        <textarea id="pesanText" placeholder="Tuliskan pesanmu disini"></textarea>

        <button type="submit">Submit</button>
    </form>

    <div id="result"></div>
    </section>

    
    <footer>
        </hr>
        <p>© 2026 Frogman. Hanya kodok biasa.</p>
    </footer>
